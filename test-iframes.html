<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEST – les deux sondages en iframe</title>
<style>
  body { margin: 0; background: #fff; font-family: Arial, Helvetica, sans-serif; }
  article { max-width: 680px; margin: 0 auto; padding: 24px 16px; }
  p { color: #52514e; font-size: 15px; }
  iframe { display: block; width: 100%; height: 600px; border: 0; margin: 16px 0; }
</style>
</head>
<body>
<article>
  <p>Texte de l'article avant les graphes…</p>
  <iframe src="test-premier-tour.html" title="Sondages du premier tour" loading="lazy"></iframe>
  <p>Texte de l'article entre les deux graphes…</p>
  <iframe src="test-second-tour.html" title="Sondages du second tour" loading="lazy"></iframe>
  <p>Texte de l'article après les graphes…</p>
</article>
<script>
window.addEventListener("message", e => {
  const d = e.data;
  if (!d || !d.sondages2027 || !d.hauteur) return;
  document.querySelectorAll("iframe").forEach(f => { if (f.contentWindow === e.source) f.style.height = d.hauteur + "px"; });
});
</script>
</body>
</html>
