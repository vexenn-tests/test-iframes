<!doctype html>

<head>

<title>TEST – Présidentielle 2027 : second tour</title>
<style>
  :root {
    color-scheme: light;
    --surface: #ffffff;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --hover: rgba(11,11,11,0.035);
    --accent: #4742ff;   /* bleu 20 Minutes */
    --seg-off: #dddcd5;  /* fond des cercles sans photo */
    --seg-ring: rgba(11,11,11,0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface: #1a1a19;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --axis: #45453f;
      --border: rgba(255,255,255,0.10);
      --hover: rgba(255,255,255,0.04);
      --accent: #6b67ff;
      --seg-off: #3a3a36;
      --seg-ring: rgba(255,255,255,0.30);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1a1a19;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --axis: #45453f;
    --border: rgba(255,255,255,0.10);
    --hover: rgba(255,255,255,0.04);
    --accent: #6b67ff;
    --seg-off: #3a3a36;
    --seg-ring: rgba(255,255,255,0.30);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--text-primary);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    line-height: 1.4;
  }
  main { padding: 12px 12px 10px; }

  .meta { color: var(--text-muted); margin: 0 0 8px; font-size: 0.75rem; }

  .filters { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 8px; }
  .filters .flabel { width: 100%; font-size: 0.72rem; font-weight: 700; color: var(--text-muted); }
  .chip {
    font: inherit; font-size: 0.78rem; padding: 3px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary);
  }
  .chip:hover { background: var(--hover); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.75rem; color: var(--text-secondary); margin: 0 0 6px; }
  .key span { display: inline-flex; align-items: center; gap: 6px; }
  .key i { display: inline-block; flex: none; }
  .key .k-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--axis); }
  .key .k-mid { width: 2px; height: 13px; background: var(--text-primary); }

  .more {
    margin: 10px 0 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 12px; font: inherit; font-size: 0.8rem; color: var(--text-secondary); cursor: pointer;
  }
  .more:hover { background: var(--hover); }
  .state {
    display: flex; align-items: center; justify-content: center; text-align: center;
    min-height: 160px; padding: 12px; color: var(--text-secondary); font-size: 0.85rem;
    border: 1px dashed var(--axis); border-radius: 8px;
  }
  .tip {
    position: fixed; pointer-events: none; z-index: 5;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 8px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    opacity: 0; transition: opacity .08s; white-space: nowrap;
  }
  .tip b { font-variant-numeric: tabular-nums; }
  footer { margin-top: 10px; font-size: 0.75rem; color: var(--text-muted); }
  footer a { color: inherit; }

  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .duel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; transition: border-color .15s;
  }
  .duel:hover { border-color: var(--axis); }
  .drow {
    display: block; width: 100%; padding: 12px 14px 10px; background: none; border: 0; font: inherit; color: inherit;
    text-align: left; cursor: pointer;
  }
  .drow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 10px; }

  .face { display: grid; grid-template-columns: 1fr 1fr; align-items: end; gap: 10px; margin-bottom: 18px; }
  .side { display: block; min-width: 0; }
  .side.r { text-align: right; }

  /* Face-à-face : photo, barre partagée, photo */
  .arena { display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 10px; }
  .arena .ddots { grid-column: 2; }
  .margin { display: block; text-align: center; margin-top: 2px; font-size: 0.8rem; color: var(--text-secondary); }
  .margin b { color: var(--text-primary); }

  /* --c : couleur du parti. En sombre, éclaircie pour rester visible (bleus nuit RN, REC…) */
  .seg, .avatar { --cc: var(--c, var(--seg-off)); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .seg, :root:not([data-theme="light"]) .avatar { --cc: color-mix(in srgb, var(--c, var(--seg-off)) 70%, #fff); }
  }
  :root[data-theme="dark"] .seg, :root[data-theme="dark"] .avatar { --cc: color-mix(in srgb, var(--c, var(--seg-off)) 70%, #fff); }
  .avatar {
    flex: none; width: 76px; height: 76px; border-radius: 50%; overflow: hidden;
    display: grid; place-items: center; background: var(--seg-off);
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--cc);
    font-size: 1.05rem; font-weight: 700; color: var(--text-secondary); letter-spacing: 0.02em;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; }
  .nm { display: block; font-size: 0.9rem; font-weight: 700; line-height: 1.25; }
  .party {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 3px;
    font-size: 0.68rem; color: var(--text-secondary);
  }
  .party i { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--seg-ring); }

  /* Barre partagée : segment gauche (largeur = score du candidat de gauche), segment droit (le reste) */
  .dbar { position: relative; display: flex; height: 24px; gap: 2px; }
  .dbar .seg {
    display: flex; align-items: center; height: 100%; padding: 0 10px; min-width: 0; overflow: hidden;
    background: var(--cc); color: var(--ink); transition: width .7s cubic-bezier(.2,.7,.2,1);
  }
  .dbar .seg:first-child { border-radius: 6px 0 0 6px; }
  .dbar .seg + .seg { border-radius: 0 6px 6px 0; flex: 1; justify-content: flex-end; }
  .seg .pc { font-size: 0.92rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .seg .pc small { font-size: 0.7em; margin-left: 1px; }
  .dbar .seg.same { opacity: 0.5; }
  .mid50 { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--text-primary); border-radius: 1px; box-shadow: 0 0 0 1.5px var(--surface); }
  .mid50::after {
    content: "50 %"; position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    font-size: 0.62rem; font-weight: 700; color: var(--text-secondary); white-space: nowrap;
  }

  .ddots { display: block; position: relative; height: 16px; margin-top: 4px; }
  .ddots .range { position: absolute; top: 7px; height: 2px; background: var(--axis); border-radius: 1px; }
  .ddots .dot {
    position: absolute; top: 8px; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%;
    background: color-mix(in srgb, var(--text-primary) 35%, transparent); box-shadow: 0 0 0 1.5px var(--surface);
  }
  .ddots .dot::before { content: ""; position: absolute; inset: -5px; }
  .ddots .m50 { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--axis); }

  .dfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .pills { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .pill {
    display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--hover);
    font-size: 0.72rem; color: var(--text-secondary); font-variant-numeric: tabular-nums;
  }
  .spread { font-size: 0.72rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .detail { font-size: 0.74rem; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .chev { display: inline-block; margin-left: 4px; transition: transform .15s; font-size: 0.65rem; }
  .drow[aria-expanded="true"] .chev { transform: rotate(90deg); }

  .polls { padding: 0 14px 12px; font-size: 0.78rem; color: var(--text-secondary); }
  .polls table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .polls th {
    text-align: left; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-muted); padding: 4px 8px; border-bottom: 1px solid var(--axis);
  }
  .polls td { padding: 4px 8px; border-bottom: 1px solid var(--grid); }
  .polls tr:nth-child(even) td { background: var(--hover); }
  .polls th:nth-child(n+3), .polls td:nth-child(n+3) { text-align: right; }
  .polls td:nth-child(n+3) { color: var(--text-primary); font-weight: 700; }
  .polls td:first-child { color: var(--text-primary); }
  #rest { margin-top: 8px; }

  @media (max-width: 560px) {
    .drow { padding: 10px 10px 8px; }
    .polls { padding: 0 10px 10px; }
    .nm { font-size: 0.85rem; }
    .avatar { width: 54px; height: 54px; font-size: 0.85rem; }
    .arena { column-gap: 6px; }
    .dbar .seg { padding: 0 6px; }
    .seg .pc { font-size: 0.82rem; }
    .polls td, .polls th { padding: 4px 5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dbar .seg { transition: none; }
  }
</style>
</head>

// Cercle photo du candidat, ou ses initiales s'il n'a pas de photo
function avatar(c) {
  const ini = esc(c.initiales);
  return `<span class="avatar" aria-hidden="true" style="--c:${c.couleur}" data-ini="${ini}">${c.photo
    ? `<img src="${esc(c.photo)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ini}</span>`;
}

// Photo introuvable ou lien cassé : on remet les initiales
document.addEventListener("error", e => {
  const img = e.target;
  if (img.tagName === "IMG" && img.parentNode.classList.contains("avatar")) img.parentNode.textContent = img.parentNode.dataset.ini;
}, true);

function renderDuels(V) {
  const T = DATA.tour2;
  document.getElementById("meta").textContent = metaText(V, T.fin);
  document.getElementById("key").hidden = false;

  const row = e => {
    const G = DATA.candidats[e.gauche], D = DATA.candidats[e.droite];
    const polls = e.sondages.map(k => T.duels[e.duel].sondages[k]);
    const pid = "d-" + esc(e.gauche + "-" + e.droite);
    const dots = polls.map(p =>
      `<span class="dot" style="left:${p.scores[e.gauche]}%" data-tip="${esc(p.institut)} · ${esc(terrain(p.debut, p.fin))} : <b>${n0(p.scores[e.gauche])} – ${n0(p.scores[e.droite])}</b>"></span>`).join("");
    const rows = polls.map(p =>
      `<tr><td>${esc(p.institut)}</td><td>${esc(terrain(p.debut, p.fin))}</td><td>${n0(p.scores[e.gauche])} %</td><td>${n0(p.scores[e.droite])} %</td></tr>`).join("");
    const spread = polls.length > 1 ? `${esc(G.nomCourt)} de ${n0(e.minGauche)} à ${n0(e.maxGauche)} %` : "";
    const margin = e.enTete === null ? "<b>À égalité</b>"
      : `<b>${esc(DATA.candidats[e.enTete].nomCourt)}</b> en tête de ${fPct(e.ecart)} point${e.ecart >= 2 ? "s" : ""}`;
    return `<li class="duel">
      <button class="drow" aria-expanded="false" aria-controls="${pid}"
        aria-label="${esc(G.nom)} ${fPct(e.moyenneGauche)} %, ${esc(D.nom)} ${fPct(e.moyenneDroite)} %, ${pl(polls.length, "sondage")}">
        <span class="face">
          <span class="side">
            <span class="nm">${esc(G.nom)}</span><span class="party"><i style="background:${G.couleur}"></i>${esc(G.partiNom)}</span>
          </span>
          <span class="side r">
            <span class="nm">${esc(D.nom)}</span><span class="party"><i style="background:${D.couleur}"></i>${esc(D.partiNom)}</span>
          </span>
        </span>
        <span class="arena">
          ${avatar(G)}
          <span class="dbar" aria-hidden="true">
            <span class="seg" style="width:50%;--c:${G.couleur};--ink:${G.encre}" data-w="${e.moyenneGauche}"><span class="pc">${big(e.moyenneGauche)}</span></span><span class="seg${G.couleur === D.couleur ? " same" : ""}" style="--c:${D.couleur};--ink:${D.encre}"><span class="pc">${big(e.moyenneDroite)}</span></span>
            <span class="mid50"></span>
          </span>
          ${avatar(D)}
          <span class="ddots" aria-hidden="true"><span class="m50"></span>${polls.length > 1 ? `<span class="range" style="left:${e.minGauche}%;width:${e.maxGauche - e.minGauche}%"></span>` : ""}${dots}</span>
        </span>
        <span class="margin">${margin}</span>
        <span class="dfoot">
          <span class="pills"><span class="pill">${pl(polls.length, "sondage")}</span><span class="pill">${pl(e.nInstituts, "institut")}</span>${spread ? `<span class="spread">${spread}</span>` : ""}</span>
          <span class="detail">Détail des sondages<span class="chev" aria-hidden="true">▶</span></span>
        </span>
      </button>
      <div class="polls" id="${pid}" hidden>
        <table>
          <thead><tr><th>Institut</th><th>Terrain</th><th>${esc(G.nomCourt)}</th><th>${esc(D.nomCourt)}</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </li>`;
  };

  const main = V.duels.filter(e => !e.replie);
  const once = V.duels.filter(e => e.replie);
  const onceLabel = once.length > 1 ? `Afficher les ${once.length} duels testés une seule fois` : "Afficher le duel testé une seule fois";
  const box = document.getElementById("duels");
  box.innerHTML = `<ol>${main.map(row).join("")}</ol>` +
    (once.length ? `<ol id="rest" hidden>${once.map(row).join("")}</ol>` +
      `<button class="more" id="more" aria-expanded="false">${onceLabel}</button>` : "");
  const more = document.getElementById("more");
  if (more) more.addEventListener("click", () => {
    const r = document.getElementById("rest");
    r.hidden = !r.hidden;
    more.setAttribute("aria-expanded", !r.hidden);
    more.textContent = r.hidden ? onceLabel : "Masquer";
  });

  // Les barres partent de 50 % puis glissent jusqu'au score (animation CSS sur la largeur)
  requestAnimationFrame(() => requestAnimationFrame(() =>
    box.querySelectorAll(".seg[data-w]").forEach(s => { s.style.width = s.dataset.w + "%"; })));
}

const metaText = (V, fin) => `${pl(V.nSondages, "sondage")} de ${pl(V.nInstituts, "institut")}` +
  (insts ? ` (${selected().join(", ")})` : "") +
  ` · terrain le plus récent : ${fDate.format(toD(fin))}`;

// ---- Interactions : infobulles, dépliage, filtres par institut ----

const tip = document.getElementById("tip");
document.addEventListener("pointerover", e => {
  const d = e.target.closest && e.target.closest(".dot[data-tip]");
  if (!d) return;
  tip.innerHTML = d.dataset.tip;
  const r = d.getBoundingClientRect();
  tip.style.opacity = 1;
  const tw = tip.offsetWidth;
  tip.style.left = Math.max(8, Math.min(window.innerWidth - tw - 8, r.left + r.width / 2 - tw / 2)) + "px";
  tip.style.top = (r.top - tip.offsetHeight - 8) + "px";
});
document.addEventListener("pointerout", e => { if (e.target.closest && e.target.closest(".dot[data-tip]")) tip.style.opacity = 0; });
window.addEventListener("scroll", () => { tip.style.opacity = 0; }, { passive: true });

document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("button[aria-controls]");
  if (!b) return;
  const open = b.getAttribute("aria-expanded") !== "true";
  b.setAttribute("aria-expanded", open);
  document.getElementById(b.getAttribute("aria-controls")).hidden = !open;
});

let DATA = null;
let insts = null;   // instituts cochés (Set), ou null pour tous

// Instituts cochés, dans l'ordre de la liste : c'est ainsi que sont formées les clés des vues précalculées
const selected = () => DATA.tour2.instituts.filter(i => insts && insts.has(i));
const viewKey = () => { const s = selected(); return s.length && s.length < DATA.tour2.instituts.length ? s.join("+") : ""; };

function update() {
  const V = DATA.tour2.vues[viewKey()];
  if (V) renderDuels(V);
  else document.getElementById("duels").innerHTML = '<div class="state">Les sondages du second tour n\'ont pas pu être affichés.</div>';
  document.querySelectorAll("#filters .chip").forEach(c =>
    c.setAttribute("aria-pressed", c.dataset.inst ? !!(insts && insts.has(c.dataset.inst)) : !insts));
}

function buildFilters() {
  const list = DATA.tour2.instituts;
  if (list.length < 2) return;
  const box = document.getElementById("filters");
  box.innerHTML = `<span class="flabel">Instituts</span>` +
    `<button class="chip" aria-pressed="true">Tous</button>` +
    list.map(i => `<button class="chip" aria-pressed="false" data-inst="${esc(i)}">${esc(i)}</button>`).join("");
  box.hidden = false;
  box.addEventListener("click", e => {
    const c = e.target.closest(".chip");
    if (!c) return;
    const i = c.dataset.inst;
    if (!i) insts = null;
    else {
      const s = new Set(insts || []);
      s.has(i) ? s.delete(i) : s.add(i);
      insts = s.size ? s : null;
    }
    try {
      const u = new URL(location.href);
      u.searchParams.delete("institut");
      selected().forEach(x => u.searchParams.append("institut", x));
      history.replaceState(null, "", u);
    } catch (err) { }
    update();
  });
  const asked = new URLSearchParams(location.search).getAll("institut").filter(x => list.includes(x));
  if (asked.length) insts = new Set(asked);
}

// ---- Démarrage ----

loadData()
  .then(data => {
    DATA = data;
    buildFilters();
    update();
  })
  .catch(err => {
    console.error(err);
    document.getElementById("duels").innerHTML =
      '<div class="state">Les sondages n\'ont pas pu être chargés. Réessayez dans quelques minutes.</div>';
  });

// Dans une iframe : envoie la hauteur de la page au site parent pour qu'il ajuste l'iframe (voir test-iframes.html)
if (window.parent !== window && "ResizeObserver" in window) {
  new ResizeObserver(() => window.parent.postMessage(
    { sondages2027: "second-tour", hauteur: Math.ceil(document.body.getBoundingClientRect().height) }, "*"))
    .observe(document.body);
}
</script>
</body>
</html>
